services:
  postgres:
    image: postgres:16-alpine
    container_name: bionic_postgres
    restart: always
    environment:
      POSTGRES_USER: bionic_user
      POSTGRES_PASSWORD: bionic_password
      POSTGRES_DB: bionic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: